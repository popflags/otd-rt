name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build and test
        run: ./build.sh

      - name: Replay recordings
        run: |
          shopt -s nullglob
          files=(recordings/*.csv)
          if [ ${#files[@]} -gt 0 ]; then
            dotnet tools/RtTool/bin/Release/net8.0/rt.dll replay "${files[@]}"
          else
            echo "No recordings committed yet."
          fi

      # Download from the run page (Summary -> Artifacts) to test a build on Windows without compiling.
      - uses: actions/upload-artifact@v4
        with:
          name: RapidTrigger-${{ github.sha }}
          path: |
            dist/RapidTrigger.zip
            dist/AnglePreservingSensitivity.zip
            dist/RtTool.zip
