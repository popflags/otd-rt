name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build and test
        run: ./build.sh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Rapid Trigger ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            Install: extract `RapidTrigger.zip` into `~/.config/OpenTabletDriver/Plugins/` (Windows: `%localappdata%\OpenTabletDriver\Plugins\`), restart the OpenTabletDriver daemon, then enable **Rapid Trigger** first in the filter list.
            Built against OpenTabletDriver 0.6.6.2. See the README for settings and calibration.
            `RtTool.zip` is the replay/calibration tool: `dotnet rt.dll --help` (needs the .NET 8 runtime, which OpenTabletDriver already requires).
          files: |
            dist/RapidTrigger.zip
            dist/RapidTrigger/RapidTrigger.dll
            dist/RtTool.zip
