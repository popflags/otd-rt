name: Release

# Releases either from a pushed v* tag, or automatically when a push to main or a claude/* branch carries a
# <Version> in src/RapidTrigger/RapidTrigger.csproj that has no v<Version> tag yet. The workflow then creates the
# tag on the pushed commit. (Cloud Claude sessions can only push their own branch, not tags.)

on:
  push:
    tags:
      - "v*"
    branches:
      - main
      - "claude/**"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decide
        id: decide
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/RapidTrigger/RapidTrigger.csproj | head -n1)
          if [ -z "$version" ]; then
            echo "No <Version> in the csproj." >&2
            exit 1
          fi
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Releasing new version $tag from $GITHUB_REF_NAME."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v4
        if: steps.decide.outputs.publish == 'true'
        with:
          dotnet-version: "8.0.x"

      - name: Build and test
        if: steps.decide.outputs.publish == 'true'
        run: ./build.sh

      # On a branch push this creates the tag on the pushed commit. A tag created with GITHUB_TOKEN does not start
      # another workflow run, so this releases once.
      - name: Publish release
        if: steps.decide.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.decide.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Rapid Trigger ${{ steps.decide.outputs.tag }}
          generate_release_notes: true
          body: |
            Install: extract `RapidTrigger.zip` into `~/.config/OpenTabletDriver/Plugins/` (Windows: `%localappdata%\OpenTabletDriver\Plugins\`), restart the OpenTabletDriver daemon, then enable **Rapid Trigger** first in the filter list.
            Built against OpenTabletDriver 0.6.7. Set the pen tip threshold to 0% in the Bindings tab. See the README for settings and calibration.
            `RtTool.zip` is the replay/calibration tool: `dotnet rt.dll --help` (needs the .NET 8 runtime, which OpenTabletDriver already requires).
          files: |
            dist/RapidTrigger.zip
            dist/RapidTrigger/RapidTrigger.dll
            dist/RtTool.zip
